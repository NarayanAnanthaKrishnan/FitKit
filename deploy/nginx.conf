limit_req_zone $binary_remote_addr zone=fitkit:10m rate=10r/s;
upstream fitkit_backend { server app:8000; }
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/fitkit/tls/fullchain.pem;
    ssl_certificate_key /etc/fitkit/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Request URLs contain dashboard bearer tokens. Never persist them.
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(integrations/telegram/webhook|ingest/health|ingest/shortcut|ingest/shortcut/validate|dashboard)$ {
        limit_req zone=fitkit burst=30 nodelay;
        proxy_pass http://fitkit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 15s;
        proxy_connect_timeout 5s;
    }
    location / { return 404; }
}
