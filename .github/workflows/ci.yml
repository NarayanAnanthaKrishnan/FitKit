name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:fitkit@127.0.0.1:5432/fitkit
      FITKIT_API_KEY: ci-api-key
      TELEGRAM_BOT_TOKEN: ci-test-token
      TELEGRAM_WEBHOOK_SECRET: ci-webhook-secret
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:fitkit@127.0.0.1:5432/fitkit_beta_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fitkit
          POSTGRES_DB: fitkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -c constraints.txt -e ".[dev]"

      - name: Create isolated test database
        env:
          PGPASSWORD: fitkit
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE fitkit_beta_test;"

      - name: Check for committed secrets
        run: python scripts/check_secrets.py --history

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q api engine scripts tests alembic

      - name: Validate migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build production image
        run: docker build -t fitkit-ci .

      - name: Verify runtime package and taxonomy
        run: docker run --rm fitkit-ci python -c "import httpx, cryptography; from importlib.resources import files; assert files('api').joinpath('data/exercise_taxonomy.csv').is_file()"

      - name: Evaluate offline safety fixtures
        run: python scripts/eval_groq.py --offline

      - name: Smoke-test the production image
        env:
          PGPASSWORD: fitkit
          DATABASE_URL: postgresql+asyncpg://postgres:fitkit@127.0.0.1:5432/fitkit_ci_migrations
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE fitkit_ci_migrations;"
          python -m alembic upgrade head
          docker run --rm -i --network host --workdir /tmp \
            -e DATABASE_URL -e FITKIT_PRODUCTION=1 -e FITKIT_BETA_USER_IDS=987654 \
            -e FITKIT_QUEUE_KEY=MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA= \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_WEBHOOK_SECRET \
            -e PUBLIC_BASE_URL=https://smoke.invalid -e LLM_ENABLED=0 \
            -e ALLOW_LEGACY_INGEST_AUTH=0 fitkit-ci python - < tests/runtime_smoke.py
