# Staging stack: PostgreSQL + FitKit API.
# Secrets are provided via environment variables (a `.env` file next to this
# file, or the shell environment), never committed.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitkit}
      POSTGRES_DB: fitkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-fitkit}@db:5432/fitkit
      FITKIT_API_KEY: ${FITKIT_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ALLOW_LEGACY_INGEST_AUTH: ${ALLOW_LEGACY_INGEST_AUTH:-1}
      DASHBOARD_LINK_TTL_SECONDS: ${DASHBOARD_LINK_TTL_SECONDS:-900}
    ports:
      - "8000:8000"

volumes:
  pgdata:
