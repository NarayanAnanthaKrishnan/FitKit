name: fitkit

x-runtime: &runtime
  build: .
  image: fitkit:local
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fitkit
    FITKIT_PRODUCTION: ${FITKIT_PRODUCTION:-1}
    ALLOW_LEGACY_INGEST_AUTH: "0"
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: /tmp
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: fitkit
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *runtime
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}

  app:
    <<: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    <<: *runtime
    command: ["python", "-m", "api.worker"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  proxy:
    image: nginx:stable-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [app]
    ports: ["443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${FITKIT_TLS_DIR:?Set FITKIT_TLS_DIR to a certificate directory}:/etc/fitkit/tls:ro

volumes:
  pgdata:
